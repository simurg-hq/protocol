version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # linters for error handling, security, typos and doc comments on exported
  # identifiers.
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive

formatters:
  enable:
    - gofmt
