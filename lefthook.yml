# Git hooks for local development, run by Lefthook. Enable once per clone with
# `lefthook install`. Only fast checks run on commit; tests run in CI on every
# pull request. Each command runs its make target when a matching file is
# staged; the target checks the working tree, as in CI.
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: ["*.go"]
      run: make fmt-check
    golangci-lint:
      glob: ["*.go", "go.mod", "go.sum", ".golangci.yml"]
      run: make lint
    schemas:
      glob: ["*.json", "scripts/ci/schema/*"]
      run: make validate-schemas
    shellcheck:
      glob: ["scripts/*.sh"]
      run: make lint-ci-scripts
    secrets:
      run: make secrets-staged
