name: Schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-schemas:
    name: validate-schemas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate schemas and fixtures
        run: make validate-schemas
