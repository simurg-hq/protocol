name: PR size

on:
  pull_request:
    # labeled/unlabeled re-run the check when size-approved changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure diff outside tests and generated files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_SIZE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'size-approved') }}
        run: make pr-size BASE="$BASE_SHA" HEAD_REF="$HEAD_SHA"
