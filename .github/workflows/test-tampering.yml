name: Test tampering

on:
  pull_request:
    # labeled/unlabeled re-run the check when tests-change-approved changes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  test-tampering:
    name: test-tampering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tests for removed assertions and added skips
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTS_CHANGE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'tests-change-approved') }}
        run: make test-tampering BASE="$BASE_SHA" HEAD_REF="$HEAD_SHA"
